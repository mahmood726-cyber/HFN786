# Comprehensive devtools check workflow for CNMA package
# Tests all package functionality including new ML, database, and reporting features
name: Devtools Comprehensive Check

on:
  push:
    branches: [main, master, claude/*]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  devtools-check:
    runs-on: ${{ matrix.config.os }}
    name: ${{ matrix.config.os }} (R-${{ matrix.config.r }})

    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: ubuntu-latest, r: 'release'}
          - {os: ubuntu-latest, r: 'devel'}
          - {os: macos-latest, r: 'release'}
          - {os: windows-latest, r: 'release'}

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
      _R_CHECK_FORCE_SUGGESTS_: false
      R_REMOTES_NO_ERRORS_FROM_WARNINGS: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Pandoc
        uses: r-lib/actions/setup-pandoc@v2

      - name: Setup R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          use-public-rspm: true

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libcurl4-openssl-dev \
            libssl-dev \
            libxml2-dev \
            libfontconfig1-dev \
            libharfbuzz-dev \
            libfribidi-dev \
            libfreetype6-dev \
            libpng-dev \
            libtiff5-dev \
            libjpeg-dev \
            libgit2-dev \
            libsqlite3-dev \
            pandoc \
            pandoc-citeproc

      - name: Query dependencies
        run: |
          install.packages(c('remotes', 'devtools', 'rcmdcheck', 'sessioninfo'))
          saveRDS(remotes::dev_package_deps(dependencies = TRUE), ".github/depends.Rds", version = 2)
          writeLines(sprintf("R-%i.%i", getRversion()$major, getRversion()$minor), ".github/R-version")
        shell: Rscript {0}

      - name: Cache R packages
        uses: actions/cache@v4
        with:
          path: ${{ env.R_LIBS_USER }}
          key: ${{ runner.os }}-${{ hashFiles('.github/R-version') }}-1-${{ hashFiles('.github/depends.Rds') }}
          restore-keys: ${{ runner.os }}-${{ hashFiles('.github/R-version') }}-1-

      - name: Install dependencies
        run: |
          remotes::install_deps(dependencies = TRUE, upgrade = "always")
          # Install all suggested packages for comprehensive testing
          install.packages(c(
            # Core dependencies
            'netmeta', 'meta', 'mvmeta', 'pcnetmeta', 'gemtc',
            # Visualization
            'ggplot2', 'plotly', 'visNetwork', 'networkD3', 'gganimate',
            'pheatmap', 'RColorBrewer', 'viridis',
            # Shiny and dashboards
            'shiny', 'shinydashboard', 'bs4Dash', 'DT', 'shinycssloaders',
            # Async processing
            'future', 'promises',
            # Machine Learning
            'randomForest', 'gbm', 'cluster', 'dbscan', 'solitude',
            # Database
            'RSQLite', 'DBI',
            # Reporting and documents
            'rmarkdown', 'knitr', 'officer', 'flextable', 'flexdashboard',
            'DiagrammeR', 'htmlwidgets',
            # AI integration
            'httr', 'jsonlite',
            # Data manipulation
            'dplyr', 'tidyr', 'readr', 'stringr',
            # Testing
            'testthat', 'covr'
          ))
        shell: Rscript {0}

      - name: Session info
        run: |
          options(width = 100)
          pkgs <- installed.packages()[, "Package"]
          sessioninfo::session_info(pkgs, include_base = TRUE)
        shell: Rscript {0}

      - name: Check package with devtools
        run: |
          devtools::check(
            document = TRUE,
            args = c('--no-manual', '--as-cran'),
            error_on = "warning",
            check_dir = "check"
          )
        shell: Rscript {0}

      - name: Run devtools tests
        run: |
          devtools::test(reporter = "progress")
        shell: Rscript {0}

      - name: Build package
        run: |
          devtools::build(path = ".")
        shell: Rscript {0}

      - name: Install package
        run: |
          devtools::install(upgrade = "never")
        shell: Rscript {0}

      - name: Test core functionality
        run: |
          library(cnma)

          # Test data simulation
          cat("Testing data simulation...\n")
          sim_data <- simulate_cnma_data(n_studies = 10, n_treatments = 4)
          print(str(sim_data))

          # Test basic NMA
          cat("\nTesting basic NMA...\n")
          nma_result <- run_cnma(
            data = sim_data,
            TE = "TE",
            seTE = "seTE",
            treat1 = "treat1",
            treat2 = "treat2",
            studlab = "studlab"
          )
          print(summary(nma_result))

          cat("\nCore functionality tests passed!\n")
        shell: Rscript {0}

      - name: Test ML functionality
        run: |
          library(cnma)

          cat("Testing Machine Learning features...\n")
          sim_data <- simulate_cnma_data(n_studies = 20, n_treatments = 5)
          nma_result <- run_cnma(sim_data, "TE", "seTE", "treat1", "treat2", "studlab")

          # Test ML predictions
          cat("\nTesting ML predictions...\n")
          ml_pred <- ml_predict_rankings(sim_data, nma_result, method = "rf")
          print(ml_pred)

          # Test pattern detection
          cat("\nTesting pattern detection...\n")
          patterns <- ml_detect_patterns(sim_data, nma_result, method = "kmeans", n_clusters = 3)
          print(patterns)

          cat("\nML functionality tests passed!\n")
        shell: Rscript {0}
        continue-on-error: true

      - name: Test database functionality
        run: |
          library(cnma)

          cat("Testing database backend...\n")
          db_path <- tempfile(fileext = ".db")
          con <- initialize_cnma_database(db_path)

          # Test project creation
          project_id <- create_project(con, "Test Project", "Test description")
          cat("Created project ID:", project_id, "\n")

          # Test dataset storage
          sim_data <- simulate_cnma_data(n_studies = 10, n_treatments = 4)
          dataset_id <- save_dataset(con, project_id, sim_data, "Test dataset")
          cat("Saved dataset ID:", dataset_id, "\n")

          DBI::dbDisconnect(con)
          cat("\nDatabase functionality tests passed!\n")
        shell: Rscript {0}
        continue-on-error: true

      - name: Upload check results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ runner.os }}-r${{ matrix.config.r }}-results
          path: check

      - name: Show testthat output
        if: always()
        run: find check -name 'testthat.Rout*' -exec cat '{}' \; || true
        shell: bash
