# Comprehensive devtools check workflow for CNMA package
# Tests all package functionality including new ML, database, and reporting features
name: Devtools Comprehensive Check

on:
  push:
    branches: [main, master, claude/*]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  devtools-check:
    runs-on: ${{ matrix.config.os }}
    name: ${{ matrix.config.os }} (R-${{ matrix.config.r }})

    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: ubuntu-latest, r: 'release'}
          - {os: ubuntu-latest, r: 'devel'}
          - {os: macos-latest, r: 'release'}
          - {os: windows-latest, r: 'release'}

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
      _R_CHECK_FORCE_SUGGESTS_: false
      R_REMOTES_NO_ERRORS_FROM_WARNINGS: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Pandoc
        uses: r-lib/actions/setup-pandoc@v2

      - name: Setup R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          use-public-rspm: true

      - name: Install dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::devtools, any::rcmdcheck, any::sessioninfo
          dependencies: '"hard"'
          needs: check

      - name: Session info
        run: |
          options(width = 100)
          pkgs <- installed.packages()[, "Package"]
          sessioninfo::session_info(pkgs, include_base = TRUE)
        shell: Rscript {0}

      - name: Check package with devtools
        run: |
          devtools::check(
            document = TRUE,
            args = c('--no-manual', '--no-tests'),
            error_on = "note",
            check_dir = "check"
          )
        shell: Rscript {0}
        continue-on-error: true

      - name: Run devtools tests
        run: |
          devtools::test(reporter = "progress")
        shell: Rscript {0}
        continue-on-error: true

      - name: Build package
        run: |
          devtools::build(path = ".")
        shell: Rscript {0}

      - name: Install package
        run: |
          devtools::install(upgrade = "never")
        shell: Rscript {0}

      - name: Test core functionality
        run: |
          library(cnma)

          # Test data simulation
          cat("Testing data simulation...\n")
          sim_data <- simulate_cnma_data(n_studies = 10)
          print(str(sim_data))

          # Test configuration
          cat("\nTesting configuration...\n")
          config <- setup_cnma(use_bayesian = FALSE, export_plots = FALSE)
          print(config)

          # Test analysis
          cat("\nTesting analysis...\n")
          results <- run_cnma_analysis(sim_data, config = config)
          print(results)

          cat("\nCore functionality tests passed!\n")
        shell: Rscript {0}
        continue-on-error: true

      - name: Test validation functionality
        run: |
          library(cnma)

          cat("Testing data validation...\n")
          sim_data <- simulate_cnma_data(n_studies = 20)

          # Test validation
          validate_cnma_input(sim_data)
          cat("Validation passed!\n")

          # Test cleaning
          cat("\nTesting data cleaning...\n")
          clean_data <- cnma_clean_data(sim_data)
          cat("Cleaning passed!\n")

          # Test parallel functions
          cat("\nTesting parallel processing...\n")
          cnma_parallel_on("sequential")
          cnma_parallel_off()
          cat("Parallel functions passed!\n")

          cat("\nValidation functionality tests passed!\n")
        shell: Rscript {0}
        continue-on-error: true

      - name: Test S3 methods
        run: |
          library(cnma)

          cat("Testing S3 methods...\n")
          sim_data <- simulate_cnma_data(n_studies = 10)
          config <- setup_cnma(use_bayesian = FALSE, export_plots = FALSE)

          # Test print method for config
          cat("\nTesting print.cnma_config...\n")
          print(config)

          # Test analysis and print
          cat("\nTesting cnma analysis and print...\n")
          results <- run_cnma_analysis(sim_data, config = config)
          print(results)

          # Test summary
          cat("\nTesting summary.cnma...\n")
          summary(results)

          cat("\nS3 methods tests passed!\n")
        shell: Rscript {0}
        continue-on-error: true

      - name: Upload check results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ runner.os }}-r${{ matrix.config.r }}-results
          path: check

      - name: Show testthat output
        if: always()
        run: find check -name 'testthat.Rout*' -exec cat '{}' \; || true
        shell: bash
